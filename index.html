
<!DOCTYPE html>
<html>
<head>
  <title>United Projects Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = L.map('map').setView([51.0447, -114.0719], 10);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    fetch('united-projects.geojson')
      .then(response => response.json())
      .then(data => {
        const statusColors = {
          "Won": "green",
          "Lose": "red",
          "Estimating": "orange",
          "Bid submitted": "blue",
          "DP placed": "pink",
          "": "gray"
        };

        L.geoJSON(data, {
          pointToLayer: function (feature, latlng) {
            const color = statusColors[feature.properties.Status] || "black";
            return L.circleMarker(latlng, {
              radius: 6,
              fillColor: color,
              color: "#000",
              weight: 1,
              opacity: 1,
              fillOpacity: 0.8
            });
          },
          onEachFeature: function (feature, layer) {
            const p = feature.properties;
            layer.bindPopup(
              `<b>${p["Project Name"]}</b><br/>
               ID: ${p["Project ID"]}<br/>
               Status: ${p["Status"]}<br/>
               Description: ${p["Description"]}<br/>
               Updated: ${p["Updated At"]}`
            );
          }
        }).addTo(map);
      });
  </script>
</body>
</html>
